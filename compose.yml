services:
  training:
    image: ghcr.io/alexbelens/training:${TRAINING_VERSION:-latest}
    build: .
    container_name: training
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    environment:
      - PORT=8080
      - TZ=${TZ:-Europe/Kyiv}
    volumes:
      - ./data:/data

  # Публичный доступ через Cloudflare Tunnel + Cloudflare Access.
  # Включается профилем: TUNNEL_TOKEN=... в .env и `docker compose --profile tunnel up -d`
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: training-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - training
